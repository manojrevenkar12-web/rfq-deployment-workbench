id: voltaro
name: Voltaro Ladetechnik GmbH
domain: charging
industry: DC fast charging infrastructure
location: Regensburg
capabilities:
  charging_power_kw: {op: max, standard: 400, limit: 400, severity: knockout}
  charge_points: {op: max, standard: 2, limit: 2, severity: major}
  output_voltage_v: {op: range, standard: [150, 1000], limit: [150, 1000], severity: knockout}
  max_current_a: {op: max, standard: 500, limit: 500, severity: major}
  efficiency_percent: {op: max, standard: 95, limit: 96, severity: minor}
  ip_rating: {op: max, standard: 55, limit: 55, severity: major}
  ambient_temperature: {op: range, standard: [-30, 50], limit: [-35, 50], severity: major}
  ocpp_version: {op: set, standard: ["1.6J", "2.0.1"], limit: ["2.1"], severity: major}
  iso15118_part: {op: set, standard: ["2"], limit: ["20"], severity: major}
  calibration_law: {op: bool, standard: true, limit: true, severity: knockout}
  adhoc_payment: {op: bool, standard: true, limit: true, severity: major}
  availability_percent: {op: max, standard: 97, limit: 98, severity: major}
  service_response_hours: {op: min, standard: 24, limit: 8, severity: major}
  cable_length_m: {op: max, standard: 5.0, limit: 7.5, severity: minor}
  penalty_cap_percent: {op: max, standard: 5, limit: 10, severity: major}
  warranty_months: {op: max, standard: 24, limit: 60, severity: major}
  payment_days: {op: max, standard: 30, limit: 60, severity: minor}
  liability: {op: set, standard: [contract_value, limited], limit: [double_contract_value], severity: major}
  delivery_weeks: {op: min, standard: 16, limit: 12, severity: major}
  spare_parts_years: {op: max, standard: 10, limit: 10, severity: minor}
  training_days: {op: max, standard: 2, limit: 3, severity: minor}
  documentation_language: {op: set, standard: [de, en], limit: [fr], severity: minor}
  bid_validity_days: {op: max, standard: 90, limit: 120, severity: minor}
norms:
  certified: [IEC 61851-1, IEC 61851-23, IEC 62196-3, ISO 15118-2, EN 61000-6-2, EN 61000-6-4, IEC 60529, IEC 62262, VDE-AR-N 4100, PTB-A 50.7]
  # The grid-connection certificate (VDE-AR-N 4110) was not mentioned in discovery: the agents ask.
  not_certified: [ISO 15118-20]
catalog:
  select_by: charging_power_kw
  variants:
    - {name: VOLT 160, charging_power_kw: 160}
    - {name: VOLT 240, charging_power_kw: 240}
    - {name: VOLT 400, charging_power_kw: 400}

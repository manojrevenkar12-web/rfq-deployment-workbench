[project]
name = "rfq-deployment-workbench"
version = "0.1.0"
description = "A deployment strategist's workbench for AI agents in industrial sales engineering: scope, prove, value and scale RFQ agents per customer."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "mcp>=2.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
rdw = "rdw.cli:main"
rdw-sim = "rdw_sim.build:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: builds the simulated customers (run once, cached)", "db: needs RDW_TEST_DATABASE_URL for Postgres"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rdw
          POSTGRES_PASSWORD: rdw
          POSTGRES_DB: rdw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rdw" --health-interval 5s --health-retries 10
    env:
      RDW_TODAY: "2026-10-26"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Lint and types
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        env:
          RDW_TEST_DATABASE_URL: postgresql+psycopg://rdw:rdw@localhost:5432/rdw
        run: pytest -q tests/test_api.py tests/test_pipeline.py
      - name: Committed reports match a fresh build
        run: |
          rdw-sim
          rdw report
          git diff --exit-code reports/WORKBENCH.md reports/workbench.json
      - name: Held-out first run is never rewritten
        run: |
          for set in heldout/*/; do
            name=$(basename "$set")
            if [ -f "reports/heldout/$name/first_run.json" ]; then
              rdw heldout "$name"
              git diff --exit-code "reports/heldout/$name/first_run.json"
            fi
          done

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, console]
    env:
      RDW_TODAY: "2026-10-26"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - run: rdw-sim
      - working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the workbench
        run: |
          nohup rdw serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            serve.log

  image:
    runs-on: ubuntu-latest
    needs: [backend, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rfq-deployment-workbench .
      - name: The image serves the API and the console
        run: |
          docker run -d --name rdw -p 8000:8000 -e RDW_TODAY=2026-10-26 rfq-deployment-workbench
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/portfolio > /dev/null
          curl -sf localhost:8000/c/voltaro/process | grep -q '<div id="root">'
